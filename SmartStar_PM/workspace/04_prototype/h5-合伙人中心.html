      const app = document.getElementById('app');
      switch (currentPage) {
        case 'home': app.innerHTML = renderHome(); break;
        case 'user/partner': app.innerHTML = renderUserPartner(); break;
        case 'user/partner/detail': app.innerHTML = renderPartnerDetail(); break;
        case 'user/partner/apply-supplier': app.innerHTML = renderApplySupplier(); break;
        case 'user/partner/apply-store': app.innerHTML = renderApplyStore(); break;
        case 'store/partner': app.innerHTML = renderStorePartner(); break;
      }
    }

    function renderHome() {
      return `<div class="page"><div class="card" style="text-align:center;padding:20px"><h2 style="font-size:18px;color:#323233;margin-bottom:16px">欢迎使用供应链管理</h2><p style="font-size:14px;color:#969799">首页内容区域</p></div></div>`;
    }

              <div class="identity-info"><div class="identity-name">${identity.typeName}</div><div class="identity-owner">归属：${identity.owner}</div></div>

    function renderApplySupplier() {
      if (showApplySuccess) {

      let html = `<div class="page"><div class="page-header"><span class="back-btn" onclick="goToPage('user/partner')">←</span><span class="page-title">申请供应商合伙人</span></div>

        html += `<div class="card"><div class="card-title">申请信息确认</div>

          <div class="confirm-item"><span class="confirm-label">合伙人等级</span><span class="confirm-value">${selectedLevel ? selectedLevel.name + ' - ' + selectedLevel.nameCn : '-'}</span></div>

          <div class="confirm-item"><span class="confirm-label">认购份额</span><span class="confirm-value">${selectedLevel?.dividendMode === '按份额' ? selectedShares + '份' : '不分份额'}</span></div>
          <div class="confirm-item"><span class="confirm-label">分红模式</span><span class="confirm-value">${selectedLevel?.dividendMode || '-'}</span></div>
          <div class="confirm-item"><span class="confirm-label">分红比例</span><span class="confirm-value">${selectedLevel ? selectedLevel.dividendRate + '%' : '-'}</span></div>
        </div><div class="notice"><p>1. 认购费用由您与供应商线下协商支付；</p><p>2. 平台仅记录归属关系，不代收认购费用；</p><p>3. 支付完成后，合伙人资格即时生效。</p></div>`;

      html += `</div><div class="bottom-btns">${applyStep > 0 ? '<button class="bottom-btn" onclick="prevStep()">上一步</button>' : ''}<button class="bottom-btn primary supplier" onclick="${applyStep === 3 ? 'submitApply()' : 'nextStep()'}" ${!canNext() ? 'disabled' : ''}>${applyStep === 3 ? '确认申请' : '下一步'}</button></div></div>`;
      return html;
    }

      } else if (applyStep === 1) {

      } else if (applyStep === 2) {
        html += `<div style="font-size:14px;color:#969799;margin-bottom:12px">选择归属地区：</div>`;
        regionList.filter(r => r.level === 'province').forEach(region => { html += `<div class="option-item ${selectedRegion?.id === region.id ? 'selected' : ''}" onclick="selectStoreRegion('${region.id}')"><div style="display:flex;justify-content:space-between;align-items:center"><div class="option-name">${region.name}</div>${selectedRegion?.id === region.id ? `<div class="option-price">¥${region.fee}</div>` : ''}</div></div>`; });
        if (selectedLevel?.dividendMode === '按份额') {
          html += `<div class="slider-container"><div class="slider-title">选择认购份额</div><div class="slider-row"><input type="range" class="slider-input" min="1" max="${selectedLevel.remainingShares || 1}" value="${selectedShares}" oninput="updateStoreShares(this.value)" style="-webkit-appearance:none;height:4px;background:#eee;border-radius:2px;flex:1"><span class="slider-value">${selectedShares}份</span></div></div>`;
        }
      } else if (applyStep === 3) {
        html += `<div class="card"><div class="card-title">申请信息确认</div>
          <div class="confirm-item"><span class="confirm-label">归属门店</span><span class="confirm-value">${selectedStore?.name || '-'}</span></div>
          <div class="confirm-item"><span class="confirm-label">合伙人等级</span><span class="confirm-value">${selectedLevel ? selectedLevel.name + ' - ' + selectedLevel.nameCn : '-'}</span></div>
          <div class="confirm-item"><span class="confirm-label">认购地区</span><span class="confirm-value">${selectedRegion?.name || '-'}</span></div>
          <div class="confirm-item"><span class="confirm-label">认购份额</span><span class="confirm-value">${selectedLevel?.dividendMode === '按份额' ? selectedShares + '份' : '不分份额'}</span></div>
          <div class="confirm-item"><span class="confirm-label">分红模式</span><span class="confirm-value">${selectedLevel?.dividendMode || '-'}</span></div>

        </div><div class="notice"><p>1. 认购费用由您与门店线下协商支付；</p><p>2. 平台仅记录归属关系，不代收认购费用；</p><p>3. 支付完成后，合伙人资格即时生效。</p></div>`;

      html += `</div><div class="bottom-btns">${applyStep > 0 ? '<button class="bottom-btn" onclick="prevStoreStep()">上一步</button>' : ''}<button class="bottom-btn primary" onclick="${applyStep === 3 ? 'submitStoreApply()' : 'nextStoreStep()'}" ${!canStoreNext() ? 'disabled' : ''}>${applyStep === 3 ? '确认申请' : '下一步'}</button></div></div>`;

    }

    function renderStorePartner() {
      const filteredList = storePartnerList.filter(item => {
        const matchSearch = item.nickname.includes(storeSearchValue) || item.phone.includes(storeSearchValue) || item.region.includes(storeSearchValue);
        const matchStatus = storeStatusFilter === 'all' || (storeStatusFilter === 'active' && item.status === 'active') || (storeStatusFilter === 'disabled' && item.status === 'disabled');
        return matchSearch && matchStatus;
      });

      let html = `<div class="page"><div class="search-bar"><input type="search" class="search-input" placeholder="搜索昵称/手机/地区" value="${storeSearchValue}" oninput="updateStoreSearch(this.value)"><select class="filter-select" value="${storeStatusFilter}" onchange="updateStoreStatus(this.value)"><option value="all">全部状态</option><option value="active">生效中</option><option value="disabled">已禁用</option></select></div><div style="padding:0 12px">`;

      if (filteredList.length === 0) {
        html += `<div class="empty-state" style="margin-top:12px"><div class="empty-icon">📭</div><div class="empty-text">暂无合伙人数据</div></div>`;
      } else {
        filteredList.forEach(partner => {
          html += `<div class="partner-item">
            <div class="partner-header"><div class="partner-user"><div class="partner-avatar">${partner.nickname.charAt(0)}</div><div><div class="partner-name">${partner.nickname}</div><div class="partner-phone">${maskPhone(partner.phone)}</div></div></div>
              <div class="partner-status ${partner.status === 'active' ? '' : 'disabled'}">${partner.status === 'active' ? '生效中' : '已禁用'}</div>
            </div>
            <div class="partner-stats">
              <div class="partner-stat"><div class="partner-stat-label">代理级别</div><div class="partner-stat-value">${partner.level}</div></div>
              <div class="partner-stat"><div class="partner-stat-label">认购地区</div><div class="partner-stat-value" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${partner.region}</div></div>
              <div class="partner-stat"><div class="partner-stat-label">累计业绩</div><div class="partner-stat-value orange">¥${formatAmount(partner.totalPerformance)}</div></div>
              <div class="partner-stat"><div class="partner-stat-label">累计分红</div><div class="partner-stat-value green">¥${formatAmount(partner.totalDividend)}</div></div>
            </div>
            <div class="partner-time">认购时间：${partner.subscribeTime}</div>
            <div class="partner-actions">
              <button class="partner-action" onclick="showStoreDividend('${partner.id}')">收益明细</button>
              <button class="partner-action ${partner.status === 'active' ? 'danger' : 'green'}" onclick="toggleStoreStatus('${partner.id}')">${partner.status === 'active' ? '禁用' : '恢复'}</button>
            </div>
          </div>`;
        });
      }

      html += '</div></div>';
      return html;
    }

    function switchTab(page) {
      currentPage = page;
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`.tab-item[data-page="${page}"]`)?.classList.add('active');
      render();
    }

    function goToPage(page) {
      currentPage = page;
      if (page === 'user/partner' || page === 'store/partner') {
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
        document.querySelector(`.tab-item[data-page="${page}"]`)?.classList.add('active');
      }
      render();
    }

    function goToDetail(type) { detailType = type; goToPage('user/partner/detail'); }
    function goToApply(type) { currentApplyType = type; applyStep = 0; selectedSupplier = null; selectedStore = null; selectedLevel = null; selectedRegion = null; selectedShares = 1; showApplySuccess = false; goToPage('user/partner/apply-' + type); }
    function goBack(page) { goToPage(page); }

    function canNext() { switch (applyStep) { case 0: return !!selectedSupplier; case 1: return !!selectedLevel; case 2: return !!selectedRegion; case 3: return true; default: return false; } }
    function canStoreNext() { switch (applyStep) { case 0: return !!selectedStore; case 1: return !!selectedLevel; case 2: return !!selectedRegion; case 3: return true; default: return false; } }

    function selectSupplier(id) { selectedSupplier = supplierList.find(s => s.id === id); render(); }
    function selectLevel(id) { selectedLevel = levelList.find(l => l.id === id); selectedShares = 1; render(); }
    function selectRegion(id) { selectedRegion = regionList.find(r => r.id === id); render(); }
    function updateShares(value) { selectedShares = parseInt(value); render(); }
    function nextStep() { if (canNext()) { applyStep++; render(); } }
    function prevStep() { if (applyStep > 0) { applyStep--; render(); } }
    function submitApply() { if (confirm(`确定要申请成为"${selectedSupplier?.name}"的合伙人吗？`)) { showApplySuccess = true; render(); } }

    function selectStore(id) { selectedStore = storeList.find(s => s.id === id); render(); }
    function selectStoreLevel(id) { selectedLevel = levelList.find(l => l.id === id); selectedShares = 1; render(); }
    function selectStoreRegion(id) { selectedRegion = regionList.find(r => r.id === id); render(); }
    function updateStoreShares(value) { selectedShares = parseInt(value); render(); }
    function nextStoreStep() { if (canStoreNext()) { applyStep++; render(); } }
    function prevStoreStep() { if (applyStep > 0) { applyStep--; render(); } }
    function submitStoreApply() { if (confirm(`确定要申请成为"${selectedStore?.name}"的合伙人吗？`)) { showApplySuccess = true; render(); } }

    function updateStoreSearch(value) { storeSearchValue = value; render(); }
    function updateStoreStatus(value) { storeStatusFilter = value; render(); }

    function showStoreDividend(id) {
      const partner = storePartnerList.find(p => p.id === id);
      if (partner) {
        document.getElementById('dividend-title').textContent = partner.nickname + ' - 收益明细';
        document.getElementById('dividend-list').innerHTML = dividendRecords.slice(0, 7).map(record => `<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f5f5f5"><div><div style="font-size:14px;margin-bottom:4px">${record.date}</div><div style="font-size:12px;color:#969799">${record.source}</div></div><div style="font-size:16px;font-weight:bold;color:#07c160">+¥${formatAmount(record.amount)}</div></div>`).join('');
        document.getElementById('popup-dividend').classList.add('show');
      }
    }

    function closePopup(id) { document.getElementById(id).classList.remove('show'); }
    function toggleStoreStatus(id) { const partner = storePartnerList.find(p => p.id === id); if (partner) { const action = partner.status === 'active' ? '禁用' : '恢复'; if (confirm(`确定要${action}合伙人"${partner.nickname}"吗？`)) { render(); } } }

    document.getElementById('popup-dividend').addEventListener('click', function(e) { if (e.target === this) { this.classList.remove('show'); } });

    render();
  </script>
</body>
</html>
